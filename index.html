<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamesquare</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @font-face { font-family: "GameCube"; src: url("GameCube.ttf") format("truetype"); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #emu { position: fixed; inset: 0; background: #000; display: none; z-index: 3; }
  #emu.on { display: block; }
  #emu iframe { width: 100%; height: 100%; border: 0; display: block; }
  #emuClose {
    position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,16,40,.7); color: #e8e4ff; font-size: 18px; cursor: pointer;
  }
  /* loading screen over a starting game: a rolling glass cube, a bar and a time estimate */
  #loading {
    position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 34px; color: #e8e4ff; font: 600 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    transition: opacity .6s ease;
  }
  #loading { cursor: pointer; }
  #loading.done { opacity: 0; pointer-events: none; }
  .ld-stage { perspective: 420px; }
  .ld-cube { width: 72px; height: 72px; position: relative; transform-style: preserve-3d; animation: ld-roll 2.6s infinite; }
  .ld-cube div {
    position: absolute; inset: 0; border-radius: 12px; border: 2px solid rgba(205,195,255,.85);
    background: rgba(120,100,240,.16); box-shadow: inset 0 0 22px rgba(150,130,255,.55), 0 0 18px rgba(140,120,255,.35);
  }
  .ld-cube div:nth-child(1) { transform: translateZ(36px); }
  .ld-cube div:nth-child(2) { transform: rotateY(90deg) translateZ(36px); }
  .ld-cube div:nth-child(3) { transform: rotateY(180deg) translateZ(36px); }
  .ld-cube div:nth-child(4) { transform: rotateY(-90deg) translateZ(36px); }
  .ld-cube div:nth-child(5) { transform: rotateX(90deg) translateZ(36px); }
  .ld-cube div:nth-child(6) { transform: rotateX(-90deg) translateZ(36px); }
  /* quarter turns with a pause between, like the cube rolling tile to tile */
  @keyframes ld-roll {
    0%, 15% { transform: rotateX(-24deg) rotateY(0); }
    25%, 40% { transform: rotateX(-24deg) rotateY(90deg); }
    50%, 65% { transform: rotateX(-24deg) rotateY(180deg); }
    75%, 90% { transform: rotateX(-24deg) rotateY(270deg); }
    100% { transform: rotateX(-24deg) rotateY(360deg); }
  }
  .ld-cube { animation-timing-function: cubic-bezier(.55, 0, .35, 1); }
  #ldName { font-size: 22px; font-weight: 700; color: #fff; max-width: 80vw; text-align: center; }
  .ld-bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  #ldFill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #6b5dde, #c4bbff); box-shadow: 0 0 12px rgba(150,130,255,.8); }
  #ldText { color: rgba(220,215,240,.75); font-size: 14px; letter-spacing: .04em; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 2; }
  #chunks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }   /* above a running game too */
  #eggCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 5; pointer-events: none; }
  #eggText {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; opacity: 0;
    text-align: center; line-height: 1.5;
    color: #fff; font: clamp(26px, 5vw, 54px)/1 "GameCube", "Arial Black", Arial, sans-serif; letter-spacing: .08em;
  }
  /* Square Off: the shooter's HUD */
  #shootHud { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: none; color: #f2f0ff; font: 600 14px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #shootHud.on { display: block; }
  #shHealth { position: absolute; top: 20px; left: 20px; display: flex; gap: 6px; }
  #shHealth i { width: 18px; height: 18px; border-radius: 3px; border: 2px solid rgba(196,187,255,.8); }
  #shHealth i.on { background: #8d7ff0; box-shadow: 0 0 10px rgba(150,130,255,.8); }
  #shScore { position: absolute; top: 16px; right: 20px; text-align: right; font: 800 28px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .02em; }
  #shBig .num { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; }
  #shScore small { display: block; margin-top: 6px; font: 600 12px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  #shCross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border: 2px solid rgba(255,255,255,.85); border-radius: 3px; }
  #shBanner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; opacity: 0; transition: opacity .3s; }
  #shBig { font: clamp(28px, 6vw, 64px)/1 "GameCube", "Arial Black", sans-serif; letter-spacing: .08em; text-shadow: 0 0 24px rgba(150,130,255,.7); }
  #shSmall { font-size: 15px; letter-spacing: .06em; opacity: .8; }
  #shHurt { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 160px rgba(255,40,70,.9); }
  #shHelp { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .08em; opacity: .55; }
  /* the Terms of Service: a long grey column of very small print */
  #tos { position: fixed; inset: 0; z-index: 4; display: none; background: rgba(6,4,18,.97); }
  #tos.on { display: block; }
  #tosScroll { position: absolute; inset: 0 0 44px; overflow-y: auto; }
  #tosBody {
    max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; color: rgba(214,210,232,.62);
    font: 12.5px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: justify;
  }
  #tosBody h1 { font-size: 18px; color: #e8e4ff; letter-spacing: .08em; text-align: center; margin: 0 0 6px; }
  #tosBody h2 { font-size: 12.5px; color: rgba(232,228,255,.8); margin: 26px 0 6px; letter-spacing: .03em; }
  #tosBody p { margin: 0 0 10px; }
  /* a big scrubber down the right edge: drag or click anywhere on it to jump */
  #tosScroll { scrollbar-width: none; }
  #tosScroll::-webkit-scrollbar { display: none; }
  #tosBar {
    position: absolute; top: 12px; bottom: 56px; right: 14px; width: 18px; border-radius: 9px; cursor: pointer;
    background: rgba(196,187,255,.1); touch-action: none;
  }
  #tosThumb {
    position: absolute; left: 0; right: 0; height: 64px; border-radius: 9px; background: #8f7cff;
    box-shadow: 0 0 12px rgba(150,130,255,.6);
  }
  #tosPct {
    position: absolute; right: 26px; top: 50%; transform: translateY(-50%); white-space: nowrap;
    color: #c4bbff; font: 600 11px "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #tosHint {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px; line-height: 44px; text-align: center;
    color: rgba(196,187,255,.7); font: 600 12px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .08em;
    border-top: 1px solid rgba(196,187,255,.12);
  }
  #credits {
    position: fixed; inset: 0; z-index: 7; display: none; overflow: hidden; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(10,8,30,.7), rgba(0,0,0,.92));
  }
  #credits.on { display: block; }
  #creditsRoll {
    position: absolute; left: 0; right: 0; top: 100%; text-align: center; color: #e8e4ff;
    font: 500 18px/1.9 "Helvetica Neue", Helvetica, Arial, sans-serif; animation: credits 16s linear forwards;
  }
  #creditsRoll h3 { font: 22px/1 "GameCube", "Arial Black", sans-serif; letter-spacing: .1em; margin: 34px 0 12px; color: #fff; }
  #creditsRoll small { color: rgba(196,187,255,.7); font-size: 13px; letter-spacing: .12em; }
  @keyframes credits { to { transform: translateY(calc(-100% - 100vh)); } }
  body.film canvas { filter: grayscale(1) sepia(.45) contrast(1.15) brightness(.95); }
  body.film::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); animation: flicker .12s steps(2) infinite;
  }
  @keyframes flicker { 50% { opacity: .82; } }
  #caption {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 6; pointer-events: none; opacity: 0;
    max-width: 86vw; text-align: center; color: #fff; text-shadow: 0 0 3px #000, 0 2px 4px #000;
    font: 500 clamp(16px, 2.3vw, 23px)/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif;
    transition: opacity .25s;
  }
  #title .logo { pointer-events: auto; cursor: pointer; }
  #title.wobble .logo { animation: wobble .7s ease; }
  @keyframes wobble { 20% { transform: rotate(-6deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
  #title {
    position: fixed; left: 0; right: 0; bottom: 15vh; text-align: center; pointer-events: none; opacity: 0;
    font: clamp(28px, 5.6vw, 60px)/1 "GameCube", "Arial Black", Arial, sans-serif; letter-spacing: .06em;
  }
  /* two stacked copies: a dark extruded layer behind, a shiny silver face on top */
  .logo { display: inline-grid; }
  .logo > span { grid-area: 1 / 1; }
  .depth {
    color: #3c3c46;
    text-shadow: 0 1px 0 #6e6e7a, 0 2px 0 #5c5c68, 0 3px 0 #4a4a56, 0 4px 0 #383844, 0 6px 12px rgba(0,0,0,.7);
  }
  .face {
    color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image:
      linear-gradient(110deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%),
      linear-gradient(180deg, #ffffff 0%, #ececf2 35%, #c8c8d2 65%, #9696a2 100%);
    background-size: 300% 100%, 100% 100%;
    background-position: 150% 0, 0 0;
    background-repeat: no-repeat;
  }
  .shine .face { animation: sheen 1.4s ease-in-out forwards; }
  .rainbow .face {
    background-image: linear-gradient(90deg, #ff6b6b, #ffd36b, #8dff8a, #6bd6ff, #b46bff, #ff6bd5, #ff6b6b);
    background-size: 200% 100%; animation: rainbow 2s linear infinite;
  }
  @keyframes rainbow { to { background-position: -200% 0; } }
  @keyframes sheen { to { background-position: -50% 0, 0 0; } }
</style>
</head>
<body>
<div id="fade"></div>
<canvas id="chunks"></canvas>
<div id="emu">
  <div id="loading">
    <div class="ld-stage"><div class="ld-cube"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
    <div id="ldName"></div>
    <div class="ld-bar"><div id="ldFill"></div></div>
    <div id="ldText"></div>
  </div>
  <button id="emuClose" aria-label="Back to menu">&#x2715;</button>
</div>
<canvas id="eggCanvas"></canvas>
<div id="eggText">3 days later</div>
<div id="caption"></div>
<div id="credits"><div id="creditsRoll"></div></div>
<div id="tos">
  <div id="tosScroll"><div id="tosBody"></div></div>
  <div id="tosBar"><div id="tosThumb"><span id="tosPct">0%</span></div></div>
  <div id="tosHint">&#8593; &#8595; scroll &nbsp;&middot;&nbsp; drag the bar on the right to skip &nbsp;&middot;&nbsp; End jumps to the bottom &nbsp;&middot;&nbsp; Tab back</div>
</div>
<div id="title"><span class="logo"><span class="depth">GAMESQUARE</span><span class="face">GAMESQUARE</span></span></div>
<audio id="snd" src="start.mp3" preload="auto"></audio>
<audio id="whoosh" src="whoosh.mp3" preload="auto"></audio>
<audio id="menu" src="menumusic.mp3" preload="auto" loop></audio>
<audio id="turn" src="turn.mp3" preload="auto"></audio>
<audio id="turnCenter" src="turn-center.mp3" preload="auto"></audio>
<audio id="selectSnd" src="menu-select.mp3" preload="auto"></audio>
<audio id="hoverSnd" src="hover.wav" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- timeline, matched to start.mp3 ----
// The thuds sit on a steady 0.26s beat from 0.72s to 3.84s: the cube lands on every one.
const DROP = 0.36, BEAT = 0.26, FIRST_LAND = 0.72;
const ROLL_START = FIRST_LAND - BEAT;
const CHIME = 4.30, SONG_END = 7.3;
// 2s after the startup sound ends, the logo gathers into a see-through cube that flies up to the camera
const OUT = SONG_END + 2, FORM = 0.85, APPROACH = 2.4;

// ---- path: 5x5 square ring with a 2-tile gap on the right so it reads as a G ----
const path = [];
for (let x = 4; x >= 0; x--) path.push([x, 0]);
for (let z = 1; z <= 4; z++) path.push([0, z]);
for (let x = 1; x <= 4; x++) path.push([x, 4]);
path.push([4, 3]);
const N = path.length - 1;
const ROLL_END = ROLL_START + N * BEAT;              // 3.84, the last thud
const HOP_END = 4.18;
const landTime = i => (i === 0 ? DROP : ROLL_START + i * BEAT);
const cell = i => new THREE.Vector3(path[i][0] - 2, 0, path[i][1] - 2);
const CORE = 1.5;                                      // size of the inner square

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = f => 1 - Math.pow(1 - f, 3);
const easeInOut = f => (1 - Math.cos(Math.PI * f)) / 2;
const smoother = f => f * f * f * (f * (6 * f - 15) + 10);
const lerp = THREE.MathUtils.lerp, rad = THREE.MathUtils.degToRad;

// ---- scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(5, 12, 7);
scene.add(sun);

// box with rounded edges: pull every vertex onto a sphere around the shrunken inner box
function roundedBox(size, radius, seg) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const h = size / 2 - radius, min = new THREE.Vector3(-h, -h, -h), max = new THREE.Vector3(h, h, h);
  const v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    c.copy(v).clamp(min, max);
    v.sub(c).normalize();
    nor.setXYZ(i, v.x, v.y, v.z);
    c.addScaledVector(v, radius);
    pos.setXYZ(i, c.x, c.y, c.z);
  }
  return g;
}

// flat, unlit 2D squares
const TILE = new THREE.Color(0x5546d6), TILE_LIT = new THREE.Color(0xc4bbff);
const makeTile = (pos, size) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color: TILE, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.copy(pos).setY(0.001);
  scene.add(m);
  return m;
};
const tiles = path.map((_, i) => makeTile(cell(i), 0.94));
const core = makeTile(new THREE.Vector3(0, 0, 0), CORE);

// shading for the finished logo: only light and shadow, laid over the tiles so it works whatever colour they are.
// Light comes from the top left, with a bevel along every edge.
const SHADE_SPAN = 5.4;
function logoShadeTexture() {
  const S = 1024, u = S / SHADE_SPAN, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const at = v => S / 2 + v * u;   // world x (or z) -> canvas pixels; canvas top is the top of the logo
  const rect = (x0, z0, x1, z1) => g.rect(at(x0), at(z0), (x1 - x0) * u, (z1 - z0) * u);
  const logo = () => {
    // the G: a 5x5 ring with its inside and the 2-tile gap on the right cut out (even-odd), plus the core
    rect(-2.5, -2.5, 2.5, 2.5); rect(-1.5, -1.5, 1.5, 1.5); rect(1.5, -1.5, 2.5, 0.5);
    rect(-CORE / 2, -CORE / 2, CORE / 2, CORE / 2);
  };
  g.beginPath();
  logo();
  g.clip('evenodd');
  // overall falloff, bright top left to dark bottom right
  const fall = g.createLinearGradient(0, 0, S, S);
  fall.addColorStop(0, 'rgba(255,255,255,.22)');
  fall.addColorStop(0.5, 'rgba(255,255,255,0)');
  fall.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = fall;
  g.fillRect(0, 0, S, S);
  // bevel: the shadow of everything outside the logo, cast in from one side
  const edge = (color, d, blur) => {
    g.save();
    g.shadowColor = color;
    g.shadowOffsetX = g.shadowOffsetY = d;
    g.shadowBlur = blur;
    g.beginPath();
    g.rect(-S, -S, S * 3, S * 3);
    logo();
    g.fillStyle = '#000';
    g.fill('evenodd');
    g.restore();
  };
  edge('rgba(255,255,255,.55)', u * 0.05, u * 0.06);
  edge('rgba(0,0,0,.6)', -u * 0.06, u * 0.08);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  return tex;
}
const logoShade = new THREE.Mesh(new THREE.PlaneGeometry(SHADE_SPAN, SHADE_SPAN),
  new THREE.MeshBasicMaterial({ map: logoShadeTexture(), transparent: true, depthWrite: false, opacity: 0 }));
logoShade.rotation.x = -Math.PI / 2;
logoShade.position.y = 0.004;
logoShade.renderOrder = 2;
scene.add(logoShade);

const cube = new THREE.Mesh(
  roundedBox(1, 0.12, 16),
  new THREE.MeshLambertMaterial({ color: 0x9b8cff, emissive: 0x3b2fa0, emissiveIntensity: 0.5 })
);
scene.add(cube);

// glass: nearly clear where you look straight through, glowing along the rounded edges,
// with a soft gloss band sliding across
const glassMat = new THREE.ShaderMaterial({
  uniforms: { opacity: { value: 0 }, time: { value: 0 }, tint: { value: new THREE.Color(0x9d8cff) } },
  vertexShader: `
    varying vec3 vN; varying vec3 vP;
    void main() {
      vN = normalize(normalMatrix * normal);
      vP = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float opacity; uniform float time; uniform vec3 tint;
    varying vec3 vN; varying vec3 vP;
    void main() {
      float rim = pow(1.0 - abs(normalize(vN).z), 1.6);
      float sweep = mod(time * 0.5, 3.0) * 2.0 - 2.0;
      float band = smoothstep(0.22, 0.0, abs(vP.x + vP.y - sweep)) * 0.3;
      vec3 col = mix(tint, vec3(1.0), clamp(rim * 0.7 + band, 0.0, 1.0));
      gl_FragColor = vec4(col * opacity * (0.06 + rim * 0.9 + band), 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});

const GHOST = 2.2, SPIN_AXIS = new THREE.Vector3(1, 1, 0.4).normalize();
const ghost = new THREE.Group();
const glassMesh = new THREE.Mesh(cube.geometry, glassMat);
glassMesh.renderOrder = 2;
ghost.add(glassMesh);

// menu labels around the edges of the front face
function labelTexture() {
  const S = 1024, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = '#f2f2f6';
  g.font = `bold ${S * 0.095}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.6)';
  g.shadowBlur = S * 0.01;
  const label = (text, x, y, angle) => {
    g.save(); g.translate(x, y); g.rotate(angle); g.fillText(text, 0, 0); g.restore();
  };
  const edge = S * 0.088;
  label('Game Play', S / 2, edge, 0);
  label('Memory Card', S / 2, S - edge, 0);
  label('Calendar', S - edge, S / 2, Math.PI / 2);
  label('Options', edge, S / 2, -Math.PI / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  return tex;
}
const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture(), transparent: true, depthWrite: false, opacity: 0 });
const labels = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), labelMat);
labels.position.z = 0.503;
labels.renderOrder = 3;
ghost.add(labels);

// button hint, e.g. [Enter] ··· Confirm: a glowing green key, dots, then the action.
// (bx, hy) is the key's left edge and vertical centre; S scales everything.
function buttonHint(g, bx, hy, S, key, action) {
  const font = px => `bold ${px}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  const bh = S * 0.085, bw = S * 0.2;
  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.save();
  g.shadowColor = 'rgba(70,200,150,.9)';
  g.shadowBlur = S * 0.03;
  const btn = g.createRadialGradient(bx + bw / 2, hy, 0, bx + bw / 2, hy, bw / 2);
  btn.addColorStop(0, '#2b7a5c'); btn.addColorStop(1, '#174a38');
  g.fillStyle = btn;
  g.beginPath(); g.roundRect(bx, hy - bh / 2, bw, bh, bh / 2); g.fill();
  g.restore();
  g.fillStyle = '#d6f2e6';
  g.font = font(S * 0.05);
  g.fillText(key, bx + bw / 2, hy + S * 0.003);
  g.fillStyle = '#f2f2f6';
  g.font = font(S * 0.055);
  g.fillText('\u00b7\u00b7\u00b7', bx + bw + S * 0.06, hy - S * 0.006);
  g.textAlign = 'left';
  g.font = font(S * 0.066);
  g.fillText(action, bx + bw + S * 0.11, hy);
  g.restore();
}

// Memory Card screen on the bottom face: comes to the front when you press down
function memoryCardTexture() {
  const S = 1024, cv = document.createElement('canvas');

function optionsTexture() {
  const S = 1024, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = '#f2f2f6';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.6)';
  g.shadowBlur = S * 0.01;
  g.font = `bold ${S * 0.1}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
  g.fillText('Options', S / 2, S * 0.12);

  // gear, drawn like the memory card: a thin outline with tapered teeth and one solid accent (the hub)
  const cx = S / 2, cy = S * 0.5, R = S * 0.23, r = R * 0.78, TEETH = 8;
  g.lineWidth = S * 0.005;
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(255,255,255,.9)';
  g.beginPath();
  for (let i = 0; i < TEETH; i++) {
    const a = i / TEETH * Math.PI * 2, step = Math.PI * 2 / TEETH;
    // each tooth: wide at the root, narrower at the tip; the gap between teeth follows the root circle
    g.arc(cx, cy, r, a - step / 2, a - step * 0.22);
    g.lineTo(cx + R * Math.cos(a - step * 0.15), cy + R * Math.sin(a - step * 0.15));
    g.arc(cx, cy, R, a - step * 0.15, a + step * 0.15);
    g.lineTo(cx + r * Math.cos(a + step * 0.22), cy + r * Math.sin(a + step * 0.22));
    g.arc(cx, cy, r, a + step * 0.22, a + step / 2);
  }
  g.closePath();
  g.stroke();
  g.fillStyle = 'rgba(205,205,215,.6)';
  g.beginPath(); g.arc(cx, cy, r * 0.42, 0, Math.PI * 2); g.arc(cx, cy, r * 0.24, 0, Math.PI * 2, true); g.fill();

  buttonHint(g, S * 0.24, S * 0.88, S, 'Enter', 'Confirm');
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;
  return tex;
}

// ---- per-frame state, fully determined by t ----
const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion();
const target = new THREE.Vector3();

// rigid roll about the leading bottom edge
function tipOver(a, b, angle) {
  const dir = b.clone().sub(a);
  q.setFromAxisAngle(new THREE.Vector3().crossVectors(up, dir).normalize(), angle);
  const offset = new THREE.Vector3(-dir.x * 0.5, 0.5, -dir.z * 0.5).applyQuaternion(q);
  cube.position.copy(a).addScaledVector(dir, 0.5).add(offset);
  cube.quaternion.copy(q);
}

function update(t) {
  cube.scale.set(1, 1, 1);
  cube.quaternion.identity();

  const u = (t - ROLL_START) / BEAT;
  if (t < DROP) {                                      // fall in
    const f = t / DROP;
    cube.position.copy(cell(0)).setY(0.5 + 8 * (1 - f * f));
  } else if (u < 0) {                                  // small bounce after the drop
    const s = (t - DROP) / (ROLL_START - DROP);
    cube.position.copy(cell(0)).setY(0.5 + 0.22 * Math.sin(Math.PI * s));
  } else if (t < ROLL_END) {                           // roll with momentum: never stops, eases over the top, swings into each landing
    const k = Math.min(N - 1, Math.floor(u));
    const p = u - k;
    tipOver(cell(k), cell(k + 1), (Math.PI / 2) * (p + 0.3 * Math.sin(2 * Math.PI * p) / (2 * Math.PI)));
    cube.position.y += 0.14 * Math.sin(Math.PI * p);   // loose, slightly airborne
    cube.rotateOnWorldAxis(up, rad(5) * Math.sin(t * 6.5));
  } else if (t < HOP_END) {                            // hop into the middle, growing into the core
    const f = clamp((t - ROLL_END) / (HOP_END - ROLL_END));
    const g = lerp(1, CORE, easeInOut(f));
    cube.scale.setScalar(g);
    cube.position.copy(cell(N)).lerp(core.position, easeInOut(f)).setY(0.5 * g + 1.8 * Math.sin(Math.PI * f));
    q.setFromAxisAngle(new THREE.Vector3(1, 0, 1).normalize(), easeInOut(f) * Math.PI);
    cube.quaternion.copy(q);
  } else {                                             // press flat into the 2D square on the chime
    const s = easeInOut(clamp((t - HOP_END) / (CHIME - HOP_END)));
    cube.scale.set(CORE, CORE * (1 - 0.98 * s), CORE);
    cube.position.copy(core.position).setY(0.5 * cube.scale.y);
  }
  cube.visible = t < CHIME;
  if (blooper) blooperCube(t);   // hold B (see "easter eggs")

  // tiles appear on each landing, everything flashes on the chime
  const chime = t >= CHIME ? Math.exp(-(t - CHIME) * 2.2) : 0;
  // once the logo is drawn, the ring's tiles grow over their gaps into one solid G
  const join = 1 + (1.003 / 0.94 - 1) * easeInOut(clamp((t - CHIME) / 0.45));
  const showTile = (m, age, grow = 1) => {
    m.visible = age >= 0;
    if (!m.visible) return;
    const p = easeOut(clamp(age / 0.12));
    m.scale.set((0.6 + 0.4 * p) * grow, (0.6 + 0.4 * p) * grow, 1);
    m.material.color.copy(TILE).lerp(TILE_LIT, clamp(0.6 * Math.exp(-age * 8) + 0.9 * chime + (t >= CHIME ? 0.2 : 0)));
  };
  tiles.forEach((m, i) => showTile(m, t - landTime(i), join));
  showTile(core, t - CHIME);
  // shading settles in once the tiles have joined, and lifts off before they're pulled away
  logoShade.material.opacity = easeInOut(clamp((t - CHIME - 0.35) / 0.6)) * (1 - easeInOut(clamp((t - OUT) / 0.2)));
  logoShade.visible = logoShade.material.opacity > 0;
  paintSpecial(t);   // rainbow / holiday colours, if any (see "easter eggs")

  // ---- outro: tiles get sucked into a see-through cube, which flies up to the camera ----
  const w = t - OUT;

  // ---- camera: fixed isometric view, then turns to top-down for the finish ----
  const c = easeInOut(clamp((t - 3.1) / (CHIME - 3.1))) * (1 - easeInOut(clamp(w / FORM)));  // back to isometric for the outro
  const az = lerp(rad(45), 0, c);
  const el = lerp(Math.atan(1 / Math.SQRT2), rad(89.5), c);
  target.set(0, 0, 0).lerp(new THREE.Vector3(0, 0, 1.2), c);
  camera.position.set(
    target.x + 30 * Math.cos(el) * Math.sin(az),
    target.y + 30 * Math.sin(el),
    target.z + 30 * Math.cos(el) * Math.cos(az)
  );
  camera.lookAt(target);
  const aspect = innerWidth / innerHeight;
  const halfH = lerp(Math.max(3.6, 4.4 / aspect), Math.max(4.6, 3.6 / aspect), c);
  camera.top = halfH; camera.bottom = -halfH;
  camera.right = halfH * aspect; camera.left = -halfH * aspect;
  camera.zoom = startupLook.tiny ? lerp(0.3, 1, smoother(clamp((t - OUT) / 1.5))) : 1;   // hold T: tiny startup
  camera.updateProjectionMatrix();

  // the see-through cube appears and, in one continuous move, spins down while flying up to the
  // camera, ending with one face square-on to it
  ghost.visible = w > 0;
  if (ghost.visible) {
    const p = smoother(clamp(w / APPROACH));
    const appear = easeOut(clamp(w / 0.6));
    const toCam = camera.position.clone().sub(target).normalize();
    const sway = Math.sin(w * 0.9) * p * p * p;               // slow swivel once it arrives
    ghost.position.set(0, GHOST / 2, 0).lerp(target.clone().addScaledVector(toCam, 12), p);
    ghost.scale.setScalar(lerp(GHOST, halfH * 1.25, p) * appear);
    q.setFromAxisAngle(SPIN_AXIS, rad(540) * (1 - p));
    ghost.quaternion.copy(camera.quaternion).multiply(turnNow(t)).multiply(q);
    ghost.rotateOnWorldAxis(toCam, rad(3) * sway);           // swivel around the axis pointing at you
    if (p >= 1) menuMischief(toCam);                          // pokes, cheats, naps (see "easter eggs")
    glassMat.uniforms.opacity.value = appear;
    glassMat.uniforms.time.value = w;
    labelMat.opacity = cardMat.opacity = calMat.opacity = playMat.opacity = optionsMat.opacity = skylerFace.material.opacity = easeInOut(clamp((w - 1.2) / 1.2));
    drawCalendar(new Date());
  }

  // tiles get pulled into the cube wherever it is
  const gather = [...tiles, core];
  gather.forEach((m, i) => {
    const f = easeInOut(clamp((w - (i / gather.length) * 0.3) / (FORM - 0.3)));
    const home = i < tiles.length ? cell(i) : new THREE.Vector3(0, 0, 0);
    m.position.copy(home).setY(0.001).lerp(ghost.position, f);
    m.material.opacity = 1 - f;
    if (w > 0) m.scale.setScalar((1 - 0.85 * f) * (i < tiles.length ? join : 1));
    if (f >= 1) m.visible = false;
  });

  const ti = clamp((t - CHIME) / 0.7);
  const title = document.getElementById('title');
  const to = 1 - easeInOut(clamp(w / 0.5));
  title.style.opacity = ti * to;
  title.style.transform = `translateY(${(1 - easeOut(ti)) * 18}px) scale(${0.85 + 0.15 * to})`;
  title.classList.toggle('shine', t > CHIME + 0.3);
}

// opened at whatever version exists, so an old copy of this page left open in another tab can't block it
function openStore(name, store, options) {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open(name);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(store)) req.result.createObjectStore(store, options); };
      req.onsuccess = () => {
        req.result.onversionchange = () => req.result.close();
        resolve(req.result.objectStoreNames.contains(store) ? req.result : null);
      };
      req.onerror = req.onblocked = () => resolve(null);
    } catch { resolve(null); }
  });

const gameDB = openStore('gamesquare-library', 'games', { autoIncrement: true }).then(async db => {
  if (!db) return db;
  const count = await new Promise(r => {
    const q = db.transaction('games').objectStore('games').count();
    q.onsuccess = () => r(q.result);
    q.onerror = () => r(1);
  });
  if (count) return db;
  const old = await Promise.race([
    new Promise(r => {
      try {
        const q = indexedDB.open('gamesquare');
        q.onupgradeneeded = () => q.transaction.abort();   // never existed: don't create it
        q.onsuccess = () => r(q.result);
        q.onerror = () => r(null);
      } catch { r(null); }
    }),
    new Promise(r => setTimeout(() => r(null), 3000)),
  ]);
  if (old && old.objectStoreNames.contains('games')) {
    const rows = await new Promise(r => {
      const q = old.transaction('games').objectStore('games').getAll();
      q.onsuccess = () => r(q.result);
      q.onerror = () => r([]);
    });
    old.close();
    await new Promise(r => {
      const tx = db.transaction('games', 'readwrite');
      rows.forEach(row => tx.objectStore('games').add(row));
      tx.oncomplete = tx.onerror = tx.onabort = r;
    });
  }

// PS1 discs come as a .cue plus one or more .bin tracks. A single-track disc is stored as just its .bin
// (EmulatorJS writes a .cue for it, and that's fastest to load); a multi-track disc is packed into one
// uncompressed .zip, which EmulatorJS unpacks and then boots from the real .cue
const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});
// the checksum runs in a worker so a big disc doesn't freeze the page
const CRC_WORKER = `
  const T = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  onmessage = async e => {
    let crc = 0xffffffff;
    const reader = e.data.stream().getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      for (let i = 0; i < value.length; i++) crc = T[(crc ^ value[i]) & 0xff] ^ (crc >>> 8);
    }
    postMessage((crc ^ 0xffffffff) >>> 0);
  };`;
async function crc32(file) {
  try {
    const worker = new Worker(URL.createObjectURL(new Blob([CRC_WORKER], { type: 'text/javascript' })));
    return await new Promise((resolve, reject) => {
      worker.onmessage = e => { worker.terminate(); resolve(e.data); };
      worker.onerror = reject;
      worker.postMessage(file);
    });
  } catch {
    let crc = 0xffffffff;   // no workers: do it here instead
    const reader = file.stream().getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      for (let i = 0; i < value.length; i++) crc = CRC_TABLE[(crc ^ value[i]) & 0xff] ^ (crc >>> 8);
    }
    return (crc ^ 0xffffffff) >>> 0;
  }
}
async function storedZip(files) {
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = new TextEncoder().encode(f.name), crc = await crc32(f);
    const local = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 10, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, f.size, 4], [22, f.size, 4], [26, name.length, 2]]
      .forEach(([at, v, n]) => (n === 4 ? local.setUint32(at, v, true) : local.setUint16(at, v, true)));
    const dir = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 10, 2], [14, 0x21, 2], [16, crc, 4], [20, f.size, 4], [24, f.size, 4], [28, name.length, 2], [42, offset, 4]]
      .forEach(([at, v, n]) => (n === 4 ? dir.setUint32(at, v, true) : dir.setUint16(at, v, true)));
    parts.push(local, name, f);
    central.push(dir, name);
    offset += 30 + name.length + f.size;
  }
  const dirSize = central.reduce((sum, p) => sum + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, dirSize, 4], [16, offset, 4]]
    .forEach(([at, v, n]) => (n === 4 ? end.setUint32(at, v, true) : end.setUint16(at, v, true)));
  return new Blob([...parts, ...central, end]);
}
// turn the picked files into games: each .cue becomes one game with the .bin files it lists
async function ps1Games(files) {
  const ext = f => f.name.split('.').pop().toLowerCase();
  const cues = files.filter(f => ext(f) === 'cue');
  const bins = files.filter(f => ext(f) === 'bin');
  const out = files.filter(f => !['cue', 'bin'].includes(ext(f)));   // .iso, .chd, .pbp... work alone
  for (const cue of cues) {
    const wanted = [...(await cue.text()).matchAll(/FILE\s+"?([^"\r\n]+?)"?\s+BINARY/gi)].map(m => m[1].toLowerCase());
    const tracks = cues.length === 1 ? bins : bins.filter(b => wanted.includes(b.name.toLowerCase()));
    if (!tracks.length) continue;
    if (tracks.length === 1) { out.push(tracks[0]); continue; }
    const zip = await storedZip([cue, ...tracks]);
    out.push(new File([zip], cue.name.replace(/\.cue$/i, '') + '.zip'));
  }
  if (!cues.length) out.push(...bins);   // a lone .bin still boots; EmulatorJS writes a .cue for it
  return out;
}

// MAME wants each game as a .zip named after the game ("sf2.zip"). Every picked folder that holds files
// becomes one stored zip named after that folder; any .zip/.7z already in there is used as it is.
async function mameGames(files) {
  const folders = new Map(), out = [];
  for (const f of files) {
    if (f.name.startsWith('.')) continue;   // .DS_Store and friends
    if (/\.(zip|7z)$/i.test(f.name)) { out.push(f); continue; }
    const parts = (f.webkitRelativePath || f.name).split('/');
    const folder = parts.length > 1 ? parts[parts.length - 2] : 'game';
    if (!folders.has(folder)) folders.set(folder, []);
    folders.get(folder).push(f);
  }
  for (const [folder, parts] of folders) out.push(new File([await storedZip(parts)], folder + '.zip'));
  return out;
}

// sounds made on the spot: a low hum for the stare, and the scare noise
function eggAudio() {
  if (!egg.audio) try { egg.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  // made before the first click (to decode the rewind sound), so it may still be waiting to start
  if (egg.audio.state === 'suspended') egg.audio.resume();
  return egg.audio;
}
function startDrone() {
  const ac = eggAudio();
  if (!ac) return;
  const osc = ac.createOscillator(), osc2 = ac.createOscillator(), gain = ac.createGain();
  osc.type = 'sine'; osc.frequency.value = 48;
  osc2.type = 'sawtooth'; osc2.frequency.value = 48.6;
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.linearRampToValueAtTime(0.18 * settings.sfx, ac.currentTime + 2.6);
  [osc, osc2].forEach(o => { o.connect(gain); o.start(); });
  gain.connect(ac.destination);
  egg.drone = { stop: () => { gain.gain.cancelScheduledValues(ac.currentTime); gain.gain.setValueAtTime(0, ac.currentTime); osc.stop(); osc2.stop(); } };
}
function scareNoise() {
  const ac = eggAudio();
  if (!ac) return;
  const t = ac.currentTime, len = 1.2;
  const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
  const noise = ac.createBufferSource(), shriek = ac.createOscillator(), shriek2 = ac.createOscillator();
  noise.buffer = buf;
  shriek.type = 'sawtooth'; shriek2.type = 'square';
  shriek.frequency.setValueAtTime(900, t); shriek.frequency.exponentialRampToValueAtTime(70, t + len);
  shriek2.frequency.setValueAtTime(1340, t); shriek2.frequency.exponentialRampToValueAtTime(95, t + len);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.75 * settings.sfx, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + len);
  [noise, shriek, shriek2].forEach(n => { n.connect(gain); n.start(t); n.stop(t + len); });
  gain.connect(ac.destination);
}
// "speech": a run of menu blips, pitched low for the cube and high for his wife
function speak(who, text, always = false) {
  const pitch = { Wife: 1.45, Boss: 0.55, Coworker: 1.2, Baby: 2.1, Dr: 1, Teen: 1.2, Gary: 1.05 }[who] || 0.8, count = Math.min(14, Math.max(3, Math.round(text.length / 3.5)));
  for (let i = 0; i < count; i++) setTimeout(() => {
    if (!egg.active && !always) return;
    const c = (i === 0 ? selectSnd : hoverSnd).cloneNode();
    c.preservesPitch = false;
    c.playbackRate = pitch * (0.85 + Math.random() * 0.35);
    c.volume = settings.sfx * (i === 0 ? 0.45 : 0.9);
    c.play().catch(() => {});
  }, i * 115);
}

let visitor = null;
function visit(name) {
  if (visitor) visitor.v.mesh.visible = false;
  visitor = { v: VISITORS[name], at: performance.now() / 1000 };
  setTimeout(() => { quip(visitor.v.line); speak(visitor.v.who, visitor.v.line, true); }, 700);
}
function updateVisitor(t, camRight, camUp, toCam) {
  if (!visitor) return;
  const { v, at } = visitor, k = t - at, mesh = v.mesh;
  if (k > 5.2) { mesh.visible = false; visitor = null; return; }
  // in from off-screen right, a pause to talk, back out
  const inn = easeOut(clamp(k / 0.7)), out = easeInOut(clamp((k - 4.4) / 0.8)), s = ghost.scale.x;
  const size = s * v.size, w = v.card ? size * 0.8 : size, h = v.card ? size * 1.1 : v.tall ? size * 1.7 : size, d = v.card ? size * 0.22 : size;
  mesh.visible = true;
  mesh.scale.set(w, h, d);
  mesh.quaternion.copy(camera.quaternion);
  const talking = k > 0.7 && k < 2.6 ? Math.abs(Math.sin(t * 17)) : 0;
  mesh.position.copy(ghost.position)
    .addScaledVector(camRight, s * lerp(2.2, 0.85, inn) + s * 1.6 * out)
    .addScaledVector(camUp, -s * 0.5 + h / 2 + talking * s * 0.04)
    .addScaledVector(toCam, s * 0.6);
}

// called from the menu cube's update once it's settled: everything above, applied to the cube
function menuMischief(toCam) {
  const t = performance.now() / 1000;
  const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  // visitors stand beside the cube while they talk
  updateVisitor(t, camRight, camUp, toCam);
  // voxels: the cube comes apart into little cubes and pulls itself back together
  const b = t - mischief.burstAt;
  menuVoxels.visible = b >= 0 && b < 2.4;
  if (menuVoxels.visible) {
    ghost.visible = false;
    const out = b < 0.8 ? easeOut(b / 0.8) : b < 1.4 ? 1 : 1 - easeInOut(clamp((b - 1.4) / 0.9));
    if (b > 2.3 && !mischief.reformed) { mischief.reformed = true; thud(0.8); }
    if (b < 0.1) mischief.reformed = false;
    menuVoxelHome.forEach((home, i) => {
      voxP.copy(home).multiplyScalar(ghost.scale.x).applyQuaternion(ghost.quaternion).add(ghost.position)
        .addScaledVector(menuVoxelDir[i], out * ghost.scale.x * 1.1);
      voxQ.setFromEuler(new THREE.Euler(out * i, out * i * 0.7, 0));
      voxM.compose(voxP, voxQ, menuVoxS.setScalar(ghost.scale.x * (0.18 - 0.06 * out)));
      menuVoxels.setMatrixAt(i, voxM);
    });
    menuVoxels.instanceMatrix.needsUpdate = true;
  }
  // lammy: four hops on the beat; dance: wiggle and bounce; double-click: a somersault
  const lm = t - mischief.lammyAt;
  if (lm < 2) ghost.position.addScaledVector(camUp, Math.abs(Math.sin(lm * Math.PI * 2)) * 0.15 * ghost.scale.x);
  const dn = t - mischief.danceAt;
  if (dn < 4) {
    ghost.rotateOnWorldAxis(camUp, Math.sin(dn * 8) * 0.35);
    ghost.rotateOnWorldAxis(toCam, Math.sin(dn * 4) * 0.15);
    ghost.position.addScaledVector(camUp, Math.abs(Math.sin(dn * 8)) * 0.08 * ghost.scale.x);
  }
  const fl = clamp((t - mischief.flipAt) / 0.8);
  if (fl < 1) ghost.rotateOnWorldAxis(camRight, -easeInOut(fl) * Math.PI * 2);
  // a happy hop for the chime
  const h = t - mischief.hopAt;
  if (h < 0.7) ghost.position.addScaledVector(camUp, Math.sin(Math.PI * h / 0.7) * 0.3 * ghost.scale.x);
  // dizzy: a wobble that settles
  const dz = clamp((t - mischief.dizzyAt) / 3.2);
  if (dz < 1) {
    ghost.rotateOnWorldAxis(toCam, Math.sin(t * 9) * 0.25 * (1 - dz));
    ghost.rotateOnWorldAxis(camRight, Math.cos(t * 7) * 0.12 * (1 - dz));
  }
  // Konami: three full spins
  const k = clamp((t - mischief.konamiAt) / 1.8);
  if (k < 1) ghost.rotateOnWorldAxis(camUp, easeInOut(k) * Math.PI * 6);
  // pokes: a jiggle
  if (t < mischief.shakeUntil) ghost.position.addScaledVector(camRight, (Math.random() - 0.5) * mischief.shake * ghost.scale.x);
  // storming off to the right, then sliding back in
  const s = t - mischief.stormAt;
  if (s < 4.4) {
    const away = s < 0.8 ? easeInOut(s / 0.8) : s < 3.2 ? 1 : 1 - easeInOut(clamp((s - 3.2) / 1.2));
    ghost.position.addScaledVector(camRight, away * ghost.scale.x * 2.6);
  }
  // asleep after 90 seconds with nobody touching anything
  const idle = (performance.now() - mischief.lastInput) / 1000;
  if (idle > 90 && menuShowing() && !mischief.asleep) { mischief.asleep = true; caption.textContent = 'z z z'; caption.style.opacity = 0.7; }
  mischief.sleepiness = mischief.asleep ? clamp((idle - 90) / 3) : Math.max(0, mischief.sleepiness - 0.05);
  if (mischief.sleepiness > 0) {
    ghost.rotateOnWorldAxis(camRight, -rad(14) * mischief.sleepiness);   // nods forward
    ghost.position.addScaledVector(camUp, -0.12 * ghost.scale.x * mischief.sleepiness * (1 + 0.15 * Math.sin(t * 1.4)));
  }
}

// push a point out of any pillar it's inside (r: the thing's own radius); true if it had to
function outOfPillars(p, r) {
  let hit = false;
  PILLARS.forEach(([x, z, w]) => {
    const dx = p.x - x, dz = p.z - z, reach = w + r;
    if (Math.abs(dx) >= reach || Math.abs(dz) >= reach) return;
    hit = true;
    if (reach - Math.abs(dx) < reach - Math.abs(dz)) p.x = x + Math.sign(dx || 1) * reach;
    else p.z = z + Math.sign(dz || 1) * reach;
  });
  const edge = SHOOT_ARENA - 0.5 - r;
  if (Math.abs(p.x) > edge || Math.abs(p.z) > edge) hit = true;
  p.x = clamp(p.x, -edge, edge);
  p.z = clamp(p.z, -edge, edge);
  return hit;
}
const inPillar = p => PILLARS.some(([x, z, w, h]) => Math.abs(p.x - x) < w && Math.abs(p.z - z) < w && p.y < h);

// voxel bits from anything that breaks
const BITS = 320;
const bitMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial(), BITS);
bitMesh.setColorAt(0, new THREE.Color());   // so its shader is built with per-bit colours from the start
bitMesh.count = 0;
bitMesh.frustumCulled = false;
shootScene.add(bitMesh);
let bits = [];
function burst(at, color, n, size = 1) {
  const c = new THREE.Color(color);
  for (let i = 0; i < n && bits.length < BITS; i++) {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9 + 0.3, Math.random() - 0.5).multiplyScalar(9 * Math.sqrt(size));
    bits.push({ p: at.clone(), v, life: 0.9 + Math.random() * 0.6, max: 1.5, s: (0.12 + Math.random() * 0.12) * size, c });
  }
}
function updateBits(dt) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  bits = bits.filter(b => (b.life -= dt) > 0);
  bits.forEach((b, i) => {
    b.v.y -= 22 * dt;
    b.p.addScaledVector(b.v, dt);
    if (b.p.y < b.s / 2) { b.p.y = b.s / 2; b.v.y *= -0.4; b.v.x *= 0.7; b.v.z *= 0.7; }
    bitMesh.setMatrixAt(i, m.compose(b.p, q, sc.setScalar(b.s * Math.min(1, b.life / 0.4))));
    bitMesh.setColorAt(i, b.c);
  });
  bitMesh.count = bits.length;
  bitMesh.instanceMatrix.needsUpdate = true;
  if (bitMesh.instanceColor) bitMesh.instanceColor.needsUpdate = true;
}

// sounds made on the spot
function blip(f0, f1, dur, type, vol) {
  const ac = eggAudio();
  if (!ac || settings.sfx <= 0) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol * settings.sfx, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function crunch(vol) {
  const ac = eggAudio();
  if (!ac || settings.sfx <= 0) return;
  const t = ac.currentTime, buf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 1400; g.gain.value = vol * settings.sfx;
  src.connect(lp); lp.connect(g); g.connect(ac.destination);
  src.start(t);
}

  shBanner.style.opacity = 1;
  clearTimeout(banner.timer);
  if (seconds) banner.timer = setTimeout(() => (shBanner.style.opacity = 0), seconds * 1000);
}
function drawHud() {
  document.getElementById('shHealth').innerHTML = Array.from({ length: SHOOT_HP }, (_, i) => `<i class="${i < shooter.hp ? 'on' : ''}"></i>`).join('');
  document.getElementById('shScore').innerHTML = `${shooter.score}<small>Wave ${Math.max(1, shooter.wave)}</small>`;
}
const bestScore = () => { try { return +localStorage.getItem('gamesquare-squareoff') || 0; } catch { return 0; } };

function resetShooter() {
  foes.forEach(f => shootScene.remove(f.mesh));
  shots.forEach(b => shootScene.remove(b.mesh));
  foes = []; shots = []; bits = [];
  Object.assign(shooter, { state: 'play', paused: false, firing: false, hp: SHOOT_HP, score: 0, wave: 0, toSpawn: [], waveAt: shooter.clock + 2.4,
    hurtAt: -9, shake: 0, yaw: 0, pitch: 0.18, vy: 0, jump: 0 });
  shooter.pos.set(0, 0, 4);
  shooter.vel.set(0, 0, 0);
  shootPlayer.quaternion.identity();
  drawHud();
}
function lockMouse() { try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch {} }
function startShooter() {
  shooter.active = true;
  shooter.clicks = 0;
  shooter.last = performance.now() / 1000;
  audio.pause();
  whoosh.pause();
  resetShooter();
  shootHud.classList.add('on');
  banner('SQUARE OFF', 'They want your tiles.', 2.2);
  chunkIn();
  lockMouse();
  menu.currentTime = 0;
  menu.preservesPitch = false;
  menu.playbackRate = 1.25;   // the menu theme, but in a hurry
  menu.volume = settings.music * 0.8;
  menu.play().catch(() => {});
}
function endShooter() {
  shooter.active = false;
  shootHud.classList.remove('on');
  if (document.pointerLockElement) document.exitPointerLock();
  menu.pause();
  menu.playbackRate = 1;
  menu.preservesPitch = true;
  menuStarted = false;
  resetShooter();
  play().catch(() => {});   // and back to the real startup
}
function hurtPlayer(n) {
  if (shooter.state !== 'play' || shooter.clock - shooter.hurtAt < 1) return;
  shooter.hp = Math.max(0, shooter.hp - n);
  shooter.hurtAt = shooter.clock;
  shooter.shake = 0.5;
  blip(240, 50, 0.35, 'sawtooth', 0.14);
  drawHud();
  if (shooter.hp > 0) return;
  shooter.state = 'over';
  shooter.firing = false;
  burst(shootPlayer.position, 0x9b8cff, 40, 1.2);
  crunch(0.5);
  const best = Math.max(bestScore(), shooter.score);
  try { localStorage.setItem('gamesquare-squareoff', best); } catch {}
  banner('YOU GOT SQUARED', `Score ${shooter.score} · Best ${best} · click to go again · Q to leave`);
  if (document.pointerLockElement) document.exitPointerLock();
}
function nextWave() {
  const n = ++shooter.wave;
  const list = [];
  for (let i = 0; i < 3 + 2 * n; i++) list.push('grunt');
  for (let i = 0; i < Math.floor(n / 2) + (n > 1); i++) list.push('gunner');
  for (let i = 0; i < Math.floor((n - 1) / 2); i++) list.push('brute');
  shooter.toSpawn = list.sort(() => Math.random() - 0.5);
  shooter.spawnAt = shooter.clock + 0.8;
  banner('WAVE ' + n, n === 1 ? '' : ['Nice.', 'They brought friends.', 'Bigger cubes now.', 'This is fine.', "Don't look at the tiles."][(n - 2) % 5], 1.8);
  drawHud();
  ding(n % 5 === 0);
}

function shoot(from, dir, speed, enemy) {
  const mesh = new THREE.Mesh(foeGeo, new THREE.MeshBasicMaterial({ color: enemy ? 0xff8a3d : 0xd9d2ff }));
  mesh.scale.setScalar(enemy ? 0.32 : 0.2);
  mesh.position.copy(from);
  shootScene.add(mesh);
  shots.push({ mesh, v: dir.clone().normalize().multiplyScalar(speed), life: enemy ? 3 : 1.2, enemy });
}
const camFwd = new THREE.Vector3(), camBack = new THREE.Vector3();
function playerShoot() {
  // aim where the crosshair points: the first cube along the camera's line of sight, or far away
  let dist = 60;
  foes.forEach(f => {
    const to = f.mesh.position.clone().sub(shootCam.position), along = to.dot(camFwd);
    if (along > 0 && to.addScaledVector(camFwd, -along).length() < f.k.size * 0.6) dist = Math.min(dist, along);
  });
  const target = shootCam.position.clone().addScaledVector(camFwd, dist);
  const muzzle = shooter.pos.clone().setY(0.6 + shooter.jump).add(new THREE.Vector3(-Math.sin(shooter.yaw), 0, -Math.cos(shooter.yaw)).multiplyScalar(0.6));
  shoot(muzzle, target.sub(muzzle), 36, false);
  blip(1500, 420, 0.08, 'square', 0.03);
}

function shooterFrame() {
  const real = performance.now() / 1000, dt = shooter.paused ? 0 : Math.min(0.05, real - shooter.last);
  shooter.last = real;
  shooter.clock += dt;
  const T = shooter.clock;
  const fwd = new THREE.Vector3(-Math.sin(shooter.yaw), 0, -Math.cos(shooter.yaw));
  const right = new THREE.Vector3(Math.cos(shooter.yaw), 0, -Math.sin(shooter.yaw));

  if (shooter.state === 'play' && dt > 0) {
    // moving: WASD relative to where you're looking, with a little hop in every step
    const want = new THREE.Vector3();
    if (held.has('w') || held.has('arrowup')) want.add(fwd);
    if (held.has('s') || held.has('arrowdown')) want.sub(fwd);
    if (held.has('d') || held.has('arrowright')) want.add(right);
    if (held.has('a') || held.has('arrowleft')) want.sub(right);
    if (want.lengthSq()) want.normalize().multiplyScalar(7.5);
    shooter.vel.lerp(want, 1 - Math.exp(-12 * dt));
    shooter.pos.addScaledVector(shooter.vel, dt);
    outOfPillars(shooter.pos, 0.5);
    shooter.vy -= 26 * dt;
    shooter.jump = Math.max(0, shooter.jump + shooter.vy * dt);
    if (shooter.jump === 0) shooter.vy = 0;
    // roll along the floor like the startup cube: a quarter turn for every tile travelled
    const flat = shooter.vel.clone().setY(0), speed = flat.length();
    if (speed > 0.01) shootPlayer.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(UP.clone().cross(flat).normalize(), speed * dt * Math.PI / 2));
    if (speed < 2.5) {
      // slowing down: settle flat onto whichever face is nearest the floor
      let best = null;
      [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)].forEach(a => {
        a.applyQuaternion(shootPlayer.quaternion);
        if (!best || Math.abs(a.y) > Math.abs(best.y)) best = a;
      });
      const level = new THREE.Quaternion().setFromUnitVectors(best, best.y > 0 ? UP : UP.clone().negate()).multiply(shootPlayer.quaternion);
      shootPlayer.quaternion.slerp(level, 1 - Math.exp(-(2.5 - speed) * 5 * dt));
    }
    if (shooter.firing && T - shooter.lastShot > 0.14) { shooter.lastShot = T; playerShoot(); }

    // waves: start the next once the last one is cleared
    if (!shooter.toSpawn.length && !foes.length && T >= shooter.waveAt) { if (shooter.wave) shooter.score += 50 * shooter.wave; nextWave(); }
    if (shooter.toSpawn.length && T >= shooter.spawnAt) { spawnFoe(shooter.toSpawn.pop()); shooter.spawnAt = T + 0.55; }
    if (!shooter.toSpawn.length && !foes.length && shooter.waveAt < T) shooter.waveAt = T + 2.4;
  }

  // the player cube
  shootPlayer.visible = shooter.state === 'play' && (T - shooter.hurtAt > 1 || Math.floor(T * 14) % 2 === 0);
  shootPlayer.position.copy(shooter.pos).setY(restHeight(shootPlayer.quaternion, 1) + shooter.jump);

  // the enemies
  foes.slice().forEach(f => {
    const m = f.mesh, size = f.k.size, age = T - f.born;
    f.flash = Math.max(0, f.flash - dt * 6);
    m.material.emissiveIntensity = 0.25 + f.flash * 1.5;
    if (age < 0.5) {   // dropping in from above, like the startup's first cube
      const k = age / 0.5;
      m.position.copy(f.pos).setY(size / 2 + 9 * (1 - k * k));
      if (age + dt >= 0.5) thud(0.7 / Math.sqrt(size));
      return;
    }
    const toPlayer = shooter.pos.clone().sub(f.pos).setY(0), dist = toPlayer.length();
    if (f.hop) {
      const k = clamp((T - f.hop.at) / f.hop.dur), e = easeInOut(k);
      f.pos.copy(f.hop.from).lerp(f.hop.to, e);
      m.quaternion.copy(f.hop.q);
      m.rotateOnWorldAxis(f.hop.axis, Math.PI / 2 * e);
      m.position.copy(f.pos).setY(restHeight(m.quaternion, size) + size * 0.35 * Math.sin(Math.PI * k));
      if (k >= 1) { f.hop = null; f.restUntil = T + f.k.rest * (0.7 + Math.random() * 0.6); }
    } else {
      m.position.copy(f.pos).setY(restHeight(m.quaternion, size));
      if (T >= f.restUntil && shooter.state === 'play') {
        // hop towards you (gunners keep their distance), sliding round pillars
        let dir = toPlayer.clone().normalize();
        if (f.kind === 'gunner' && dist < 9) dir.negate();
        if (f.kind === 'gunner' && Math.abs(dist - 10) < 1.5) dir.set(-dir.z, 0, dir.x).multiplyScalar(Math.random() < 0.5 ? 1 : -1);
        let to = f.pos.clone().addScaledVector(dir, size * 1.1);
        for (let tries = 0; tries < 4 && outOfPillars(to.clone(), size / 2); tries++) {
          dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), (tries % 2 ? -1 : 1) * 1.2 * (tries + 1));
          to = f.pos.clone().addScaledVector(dir, size * 1.1);
        }
        outOfPillars(to, size / 2);
        f.hop = { from: f.pos.clone(), to, at: T, dur: 0.3 + 0.12 * size, q: m.quaternion.clone(), axis: new THREE.Vector3(0, 1, 0).cross(dir).normalize() };
      }
    }
    if (f.kind === 'gunner' && T >= f.nextShot && dist < 16 && shooter.state === 'play') {
      f.nextShot = T + 1.6 + Math.random();
      shoot(m.position.clone(), shooter.pos.clone().setY(0.5 + shooter.jump).sub(m.position), 12, true);
      blip(520, 180, 0.16, 'sawtooth', 0.035);
    }
    // touching you: grunts go off like a bomb, the others knock you about
    if (dist < size / 2 + 0.55 && shooter.jump < size * 0.8 && shooter.state === 'play') {
      hurtPlayer(f.k.damage);
      shooter.vel.addScaledVector(toPlayer.normalize(), 14);
      if (f.kind === 'grunt') { killFoe(f); crunch(0.3); }
    }
  });

  // shots in flight
  shots = shots.filter(b => {
    b.life -= dt;
    b.mesh.position.addScaledVector(b.v, dt);
    b.mesh.rotation.x += dt * 9; b.mesh.rotation.y += dt * 7;
    const p = b.mesh.position;
    let gone = b.life <= 0 || p.y < 0 || inPillar(p) || Math.abs(p.x) > SHOOT_ARENA || Math.abs(p.z) > SHOOT_ARENA;
    if (!gone && b.enemy && shooter.state === 'play' && p.distanceTo(shootPlayer.position) < 0.7) { hurtPlayer(1); gone = true; }
    if (!gone && !b.enemy) {
      const f = foes.find(o => p.distanceTo(o.mesh.position) < o.k.size * 0.62);
      if (f) {
        gone = true;
        f.flash = 1;
        if (--f.hp <= 0) { shooter.score += f.k.points; killFoe(f); crunch(0.22); drawHud(); }
        else thud(1.2);
      }
    }
    if (gone) { shootScene.remove(b.mesh); if (b.life > 0) burst(p, b.enemy ? 0xff8a3d : 0xd9d2ff, 4, 0.4); }
    return !gone;
  });
  updateBits(dt);

  // over-the-shoulder camera
  camBack.set(Math.sin(shooter.yaw) * Math.cos(shooter.pitch), Math.sin(shooter.pitch), Math.cos(shooter.yaw) * Math.cos(shooter.pitch));
  camFwd.copy(camBack).negate();
  const pivot = shooter.pos.clone().setY(1.3 + shooter.jump * 0.6);
  shootCam.position.copy(pivot).addScaledVector(camBack, 5.6).addScaledVector(right, 0.9);
  shootCam.position.y = Math.max(0.4, shootCam.position.y);
  shooter.shake = Math.max(0, shooter.shake - dt * 1.5);
  shootCam.position.x += (Math.random() - 0.5) * shooter.shake;
  shootCam.position.y += (Math.random() - 0.5) * shooter.shake;
  shootCam.lookAt(shootCam.position.clone().add(camFwd));
  document.getElementById('shHurt').style.opacity = clamp(1 - (T - shooter.hurtAt) / 0.6) * 0.8;
  renderer.render(shootScene, shootCam);
}

// counting clicks on the cube while it rolls and draws the logo
addEventListener('pointerdown', e => {
  if (!running || waiting || egg.active || shooter.active || rewind) return;
  const t = now();
  if (t < 0.05 || t >= CHIME || !cube.visible) return;
  const p = cube.position.clone().project(camera);
  const dx = (p.x + 1) / 2 * innerWidth - e.clientX, dy = (1 - p.y) / 2 * innerHeight - e.clientY;
  if (Math.hypot(dx, dy) > innerHeight * 0.13) return;
  const real = performance.now() / 1000;
  shooter.clicks = real - shooter.lastClick > 1.5 ? 1 : shooter.clicks + 1;
  shooter.lastClick = real;
  cube.material.emissiveIntensity = 1.8;   // it notices
  thud(1.2 + shooter.clicks * 0.12);
  if (shooter.clicks >= 5) startShooter();
});
// in the game: the mouse aims and fires, Space jumps, Q leaves
addEventListener('mousemove', e => {
  if (!shooter.active || document.pointerLockElement !== renderer.domElement || shooter.state !== 'play') return;
  shooter.yaw -= e.movementX * 0.0024;
  shooter.pitch = clamp(shooter.pitch + e.movementY * 0.0022, -0.35, 0.75);
});
addEventListener('pointerdown', e => {
  if (!shooter.active || e.button !== 0) return;
  if (shooter.state === 'over') { resetShooter(); banner('SQUARE OFF', 'Again.', 1.6); lockMouse(); return; }
  if (document.pointerLockElement !== renderer.domElement) { lockMouse(); return; }
  shooter.firing = true;
});
addEventListener('pointerup', () => (shooter.firing = false));
document.addEventListener('pointerlockchange', () => {
  if (!shooter.active || shooter.state !== 'play') return;
  shooter.paused = document.pointerLockElement !== renderer.domElement;
  shooter.firing = false;
  if (shooter.paused) banner('PAUSED', 'Click to keep going · Q to leave');
  else shBanner.style.opacity = 0;
});
function shooterKey(e) {
  const k = e.key.toLowerCase();
  if (k === 'q') return endShooter();
  if (k === ' ') {
    e.preventDefault();
    if (shooter.state === 'play' && !shooter.paused && shooter.jump === 0) { shooter.vy = 9; blip(300, 700, 0.12, 'sine', 0.06); }
  }
  if (k === 'tab') e.preventDefault();
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  shootCam.aspect = innerWidth / innerHeight;
  shootCam.updateProjectionMatrix();
  cardCam.aspect = innerWidth / innerHeight;
  cardCam.updateProjectionMatrix();
  eggCam.aspect = innerWidth / innerHeight;
  eggCam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  if (shooter.active) return shooterFrame();
  cube.material.emissiveIntensity += (0.5 - cube.material.emissiveIntensity) * 0.12;   // settles after a click (see Square Off)
  if (egg.active) {
    // if anything in the story ever breaks, drop out of it rather than freezing the page
    try { if (egg.sequel ? sequelFrame() : eggFrame()) return; } catch (err) { console.error(err); endEgg(); }
  }
  const t = now();
  if (t >= OUT && !whooshed) { whooshed = true; whoosh.currentTime = 0; whoosh.volume = startupLook.film ? 0 : settings.sfx; whoosh.play().catch(() => {}); }
  if (t >= OUT && startupLook.pending) endStartupLook();
  // menu theme starts once the cube has arrived, fading in over 1.5s, and loops
  const MENU = OUT + APPROACH;
  if (t >= MENU && !menuStarted) { menuStarted = true; menu.currentTime = 0; menu.volume = 0; menu.play().catch(() => {}); }
  if (menuStarted) menu.volume = clamp((t - MENU) / 1.5) * settings.music * (1 - 0.5 * mischief.sleepiness);
  if (emuBox.classList.contains('on')) return;   // nothing to draw behind a running game
  if (cardView.open) {
    updateCard(performance.now() / 1000);
    renderer.render(cardScene, cardCam);
  } else {
    update(t);
    renderer.render(scene, camera);
  }
});
</script>
</body>
</html>
